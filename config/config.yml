# Конфігурація RSI-SMA торгового бота

# Основні параметри стратегії
strategy:
  name: "RSI-SMA"
  version: "1.0"

  # Параметри індикаторів
  indicators:
    rsi_period: 14
    rsi_sma_period: 14
    bollinger_stddev: 2  # Опціонально для додаткових фільтрів

  # Основні параметри стратегії
  parameters:
    min_diff: 2.0                    # Мінімальна різниця для входу
    trend_candles: 3                 # Кількість свічок для підтвердження тренду
    delay_candles: 5                 # Кількість свічок затримки після закриття позиції
    long_entry_max_rsi: 40          # Максимальний RSI для входу в LONG
    short_entry_min_rsi: 60         # Мінімальний RSI для входу в SHORT
    overbought_level: 70            # Рівень перекупленості
    oversold_level: 30              # Рівень перепроданості
    diff_smoothing_periods: 3       # Періоди для згладжування різниці

  # Таймфрейми
  timeframes:
    primary: "1m"      # Основний таймфрейм для сигналів
    confirmation: "5m"  # Таймфрейм для підтвердження

# Налаштування бірж
exchanges:
  bybit:
    enabled: true
    priority: 1
    api_key: "${BYBIT_API_KEY}"
    api_secret: "${BYBIT_API_SECRET}"
    testnet: false
    endpoints:
      spot: "https://api.bybit.com"
      futures: "https://api.bybit.com"
    rate_limits:
      requests_per_second: 10
      requests_per_minute: 120

  binance:
    enabled: false
    priority: 2
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: false
    endpoints:
      spot: "https://api.binance.com"
    rate_limits:
      requests_per_second: 20
      requests_per_minute: 1200

  okx:
    enabled: false
    priority: 3
    api_key: "${OKX_API_KEY}"
    api_secret: "${OKX_API_SECRET}"
    passphrase: "${OKX_PASSPHRASE}"
    testnet: false

# Торгові пари
pairs:
  - symbol: "BTCUSDT"
    enabled: true
    exchanges: ["bybit", "binance"]
    min_volume_24h: 1000000  # Мінімальний об'єм за 24 години

  - symbol: "ETHUSDT"
    enabled: true
    exchanges: ["bybit", "binance"]
    min_volume_24h: 500000

  - symbol: "ADAUSDT"
    enabled: false
    exchanges: ["bybit"]
    min_volume_24h: 100000

  - symbol: "SOLUSDT"
    enabled: false
    exchanges: ["bybit"]
    min_volume_24h: 200000



# Управління ризиками
risk_management:
  max_positions_per_pair: null  # null = без обмежень для хеджування
  max_risk_per_trade_percent: 2.0  # % від депозиту
  max_total_risk_percent: 10.0     # Загальний ризик
  enable_hedging: true             # Дозволити хеджування
  enable_cross_exchange_arbitrage: true  # Арбітраж між біржами

  # Trailing stop (опціонально)
  trailing_stop:
    enabled: false
    distance_percent: 2.0

  # Stop Loss / Take Profit
  stop_loss_percent: 5.0
  take_profit_percent: 10.0

# Система делею
delay_system:
  enabled: true
  default_delay_candles: 5
  # Окремі налаштування для різних пар
  custom_delays:
    BTCUSDT: 3
    ETHUSDT: 5

# Налаштування логування
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Файли логів
  files:
    main_log: "logs/bot.log"
    error_log: "logs/errors.log"
    trade_log: "logs/trades.log"
    api_log: "logs/api.log"

  # Ротація логів
  rotation:
    max_size: "10MB"
    backup_count: 5

  # CSV файли для сигналів
  csv_files:
    signals: "data/signals.csv"
    detailed_log: "data/detailed_log.csv"
    historical_signals: "data/historical_signals.csv"

# Налаштування даних
data:
  # Локальне збереження
  local_storage:
    enabled: true
    format: "csv"  # csv або sqlite
    base_path: "data/history"

  # Кешування
  cache:
    enabled: true
    ttl_minutes: 5  # Time to live для кешу

  # Історичні дані
  history:
    default_days: 90
    max_days: 365
    cleanup_after_days: 30  # Очищення старих даних

# Налаштування WebSocket
websocket:
  reconnect_attempts: 5
  reconnect_delay: 5  # секунд
  ping_interval: 30
  timeout: 60

# Налаштування для бектесту
backtest:
  commission_percent: 0.1  # Комісія біржі
  slippage_percent: 0.05   # Проковзування
  initial_balance: 10000   # Початковий баланс для бектесту

# Моніторинг та алерти (опціонально)
monitoring:
  enabled: false

  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "${EMAIL_USERNAME}"
    password: "${EMAIL_PASSWORD}"
    from_email: "${EMAIL_FROM}"
    to_email: "${EMAIL_TO}"

  webhook:
    enabled: false
    url: "${WEBHOOK_URL}"

# Health check
health_check:
  enabled: true
  interval_seconds: 60
  max_memory_mb: 1024
  max_cpu_percent: 80

# Додаткові налаштування
misc:
  timezone: "UTC"
  date_format: "%Y-%m-%d %H:%M:%S"
  decimal_places: 8

  # Graceful shutdown
  shutdown_timeout: 30  # секунд

  # Retry механізми
  retry_attempts: 3
  retry_delay: 1  # секунд